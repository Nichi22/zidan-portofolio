<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhamad Zidan | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --neon-blue: #3b82f6; --neon-orange: #f97316; }
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }

        /* --- BACKGROUND & LOADING --- */
        #particleCanvas { position: fixed; inset: 0; z-index: -1; opacity: 0.4; }
        #preloader { position: fixed; inset: 0; background: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 1s cubic-bezier(1, 0, 0, 1); }
        .page-loaded #preloader { transform: translateY(-100%); }

        /* --- ANIMASI TEKS BERKEDIP PELAN --- */
        @keyframes softBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .blink-slow { animation: softBlink 3s ease-in-out infinite; }

        /* --- UI ELEMENTS --- */
        .tab-container { background: rgba(30, 41, 59, 0.5); padding: 4px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.1); display: inline-flex; }
        .tab-btn { padding: 8px 24px; border-radius: 9999px; font-weight: 700; font-size: 0.75rem; transition: all 0.3s; color: #94a3b8; border: none; cursor: pointer; }
        .tab-btn.active { background: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.4s; }
        .glass-card:hover { transform: translateY(-5px); border-color: var(--neon-blue); }
        
        /* ADMIN VISIBILITY */
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: inline-flex !important; }
        #particleCanvas { pointer-events: none; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="overflow-hidden">

    <canvas id="particleCanvas"></canvas>

    <div id="preloader">
        <h1 class="text-4xl font-black bg-gradient-to-r from-blue-500 to-orange-500 bg-clip-text text-transparent tracking-tighter">MUHAMAD ZIDAN</h1>
        <p class="text-[10px] tracking-[0.3em] text-gray-500 mt-2 uppercase font-bold">zidan-portofolio</p>
        <div class="mt-8 w-48 h-1 bg-slate-900 rounded-full overflow-hidden">
            <div id="loading-bar" class="h-full bg-blue-500 w-0 transition-all duration-500"></div>
        </div>
    </div>

    <nav class="fixed top-0 w-full z-50 p-6 bg-slate-950/50 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div id="admin-trigger" class="text-2xl font-black text-blue-500 cursor-pointer hover:scale-110 transition">MZ</div>

                <button id="logout-btn" class="admin-only bg-red-500/10 text-red-500 border border-red-500/30 px-4 py-2 rounded-full hover:bg-red-500 hover:text-white transition">LOGOUT</button>
            </div>
        </div>
    </nav>

    <main class="relative pt-32 pb-20 px-6 max-w-6xl mx-auto">
        
        <section id="about" class="py-12 grid lg:grid-cols-12 gap-16 items-center">
            <div class="lg:col-span-5 flex justify-center" data-aos="fade-right">

                    <a href="mailto:zidanmuham4@gmail.com" class="glass-card p-5 rounded-[2rem] flex items-center gap-5 group hover:border-red-500/50">
                        <div class="w-10 h-10 bg-red-500/20 rounded-xl flex items-center justify-center group-hover:bg-red-500 transition-all flex-shrink-0">
                            <svg class="w-5 h-5 text-red-500 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>

                <div class="lg:col-span-7">
                    <div class="glass-card p-8 rounded-[2.5rem] relative overflow-hidden">
                        <div class="flex items-center gap-4 mb-6"><div class="w-2 h-2 bg-orange-500 rounded-full animate-ping"></div><h3 class="font-bold">Leave a Comment</h3></div>

    <div id="login-modal" class="hidden fixed inset-0 z-[10001] bg-black/70 backdrop-blur-sm items-center justify-center p-6">
        <form id="login-form" class="glass-card w-full max-w-sm rounded-[2rem] p-8 space-y-4">
            <h3 class="font-black uppercase text-lg">Admin Login</h3>
            <input id="login-email" type="email" required autocomplete="username" placeholder="Email" class="w-full bg-slate-900 border border-white/5 rounded-xl p-4 text-sm text-white focus:border-blue-500 outline-none">
            <input id="login-pass" type="password" required autocomplete="current-password" placeholder="Password" class="w-full bg-slate-900 border border-white/5 rounded-xl p-4 text-sm text-white focus:border-blue-500 outline-none">
            <p id="login-err" class="text-red-500 text-xs min-h-[1rem]"></p>
            <div class="flex gap-3">
                <button type="button" id="login-cancel" class="flex-1 py-3 rounded-xl border border-white/10 text-xs font-bold">BATAL</button>
                <button type="submit" class="flex-1 py-3 rounded-xl bg-blue-600 text-xs font-black">MASUK</button>
            </div>
        </form>
    </div>

    <button id="save-btn" class="admin-only fixed bottom-8 right-8 bg-green-500 text-white px-8 py-4 rounded-full font-black shadow-2xl z-[9999] hover:scale-105 active:scale-95 transition">💾 SYNC CHANGES</button>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCI1sCEjXqsuUtOgoAOLbY5q0PfmtDVHGk", authDomain: "nichi-efeef.firebaseapp.com", projectId: "nichi-efeef", storageBucket: "nichi-efeef.firebasestorage.app", messagingSenderId: "874414832026", appId: "1:874414832026:web:28b2a04dc674b78f50a223" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const ref = doc(db, "portfolio", "zidan-data");
        let myData = { about: "", photo: "", skills: [], projects: [], certs: [], comments: [] };

        let adminOn = false;
        const isAdmin = () => adminOn;
        const $ = (id) => document.getElementById(id);
        // cegah XSS: semua teks dari database di-escape sebelum masuk innerHTML
        const esc = (t) => String(t ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        const safeSrc = (u) => /^(https?:|data:image\/)/i.test(u || '') ? esc(u) : '';
        // simpan hanya field yang berubah (merge) supaya data pengunjung lain tidak tertimpa
        const save = (patch) => setDoc(ref, patch, { merge: true });

        // --- AUTH & ADMIN (Firebase Authentication) ---
        onAuthStateChanged(auth, (user) => {
            adminOn = !!user;
            document.body.classList.toggle('is-admin', adminOn);
            $('about-desc').contentEditable = adminOn ? "true" : "false";
            renderSkills(); renderProjects(); renderComments();
        });

        let hit = 0, hitTimer;
        $('admin-trigger').onclick = () => {
            hit++;
            clearTimeout(hitTimer);
            hitTimer = setTimeout(() => hit = 0, 3000);
            if (hit >= 5 && !adminOn) { hit = 0; $('login-modal').classList.remove('hidden'); $('login-modal').classList.add('flex'); $('login-email').focus(); }
        };
        const closeLogin = () => { $('login-modal').classList.add('hidden'); $('login-modal').classList.remove('flex'); $('login-err').textContent = ''; $('login-pass').value = ''; };
        $('login-cancel').onclick = closeLogin;
        $('login-form').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, $('login-email').value.trim(), $('login-pass').value);
                closeLogin();
            } catch (err) {
                $('login-err').textContent = "Email atau password salah.";
            }
        };
        $('logout-btn').onclick = async () => { if (confirm("Logout from system?")) await signOut(auth); };

        // --- DATA SYNC ---
        onSnapshot(ref, (snap) => {
            if (snap.exists()) myData = { ...myData, ...snap.data() };
            const descBox = $('about-desc');
            // jangan timpa teks yang sedang diedit admin
            if (!(isAdmin() && document.activeElement === descBox)) {
                descBox.innerHTML = myData.about || "Halo! Selamat datang di portofolio saya.";
            }
            if (myData.photo) {
                $('profile-img').src = myData.photo;
                $('profile-img').classList.remove('hidden');
                $('initials').classList.add('hidden');
            }
            renderSkills();
            renderProjects();
            renderComments();
        }, (err) => {
            console.error(err);
            $('about-desc').textContent = "Gagal memuat data. Cek koneksi atau aturan Firestore.";
        });

        // --- SKILLS ---
        function renderSkills() {
            $('skills-container').innerHTML = (myData.skills || []).map((sk, i) => `
                <span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[10px] font-bold px-3 py-1 rounded-full">${esc(sk)}${isAdmin() ? ` <button onclick="delSkill(${i})" class="text-red-500 ml-1">×</button>` : ''}</span>
            `).join('');
        }
        $('add-skill').onclick = async () => {
            const sk = (prompt("Nama skill:") || "").trim();
            if (sk) await save({ skills: [...(myData.skills || []), sk] });
        };
        window.delSkill = async (i) => {
            if (!isAdmin()) return;
            await save({ skills: (myData.skills || []).filter((_, idx) => idx !== i) });
        };

        // --- FOTO PROFIL & GAMBAR (dikompres agar muat di batas 1MB Firestore) ---
        function fileToDataUrl(file, maxSize, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        const r = Math.min(1, maxSize / Math.max(img.width, img.height));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * r);
                        c.height = Math.round(img.height * r);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        resolve(c.toDataURL('image/jpeg', quality));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }
        $('inp-profile').onchange = async (e) => {
            const f = e.target.files[0];
            if (!f || !isAdmin()) return;
            await save({ photo: await fileToDataUrl(f, 500, 0.8) });
            e.target.value = '';
        };

        // --- PROJECTS & CERTS ---
        window.addItem = async (type) => {
            if (!isAdmin()) return;
            const name = (prompt("Judul:") || "").trim();
            if (!name) return;
            let img = (prompt("URL gambar (kosongkan untuk upload dari perangkat):") || "").trim();
            if (!img) {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                img = await new Promise(res => {
                    input.onchange = async () => res(input.files[0] ? await fileToDataUrl(input.files[0], 700, 0.7) : "");
                    input.click();
                });
            }
            await save({ [type]: [...(myData[type] || []), { name, img }] });
        };
        window.delItem = async (type, i) => {
            if (!isAdmin() || !confirm("Hapus item ini?")) return;
            await save({ [type]: (myData[type] || []).filter((_, idx) => idx !== i) });
        };

        function renderProjects() {
            const grid = (type) => (myData[type] || []).map((p, i) => `
                <div class="glass-card p-4 rounded-[2rem]">
                    ${safeSrc(p.img) ? `<img src="${safeSrc(p.img)}" alt="${esc(p.name)}" loading="lazy" class="w-full h-40 object-cover rounded-2xl mb-4">` : `<div class="w-full h-40 bg-slate-800 rounded-2xl mb-4"></div>`}
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-sm uppercase">${esc(p.name)}</h4>
                        ${isAdmin() ? `<button onclick="delItem('${type}', ${i})" class="text-red-500 text-[10px] font-bold hover:underline">HAPUS</button>` : ''}
                    </div>
                </div>
            `).join('');
            $('projects-grid').innerHTML = grid('projects');
            $('certs-grid').innerHTML = grid('certs');
        }

        // --- COMMENTS ---
        function renderComments() {
            $('comment-list').innerHTML = (myData.comments || []).map(c => `
                <div class="glass-card p-5 rounded-2xl border-l-4 border-blue-500 flex justify-between items-start">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="font-bold text-blue-400 text-sm">@${esc(c.name)}</span>
                            <span class="text-[9px] text-gray-500">${esc(c.date)}</span>
                        </div>
                        <p class="text-gray-300 text-sm leading-relaxed break-words">${esc(c.message)}</p>
                    </div>
                    ${isAdmin() ? `<button onclick="deleteComment(${Number(c.id)})" class="text-red-500 text-[10px] font-bold hover:underline ml-4">DELETE</button>` : ''}
                </div>
            `).join('');
        }

        window.deleteComment = async (commentId) => {
            if (!isAdmin() || !confirm("Delete this comment?")) return;
            const target = (myData.comments || []).find(c => c.id === commentId);
            if (target) await save({ comments: arrayRemove(target) });
        };

        window.sendComment = async () => {
            const name = $('comm-name').value.trim().slice(0, 40);
            const msg = $('comm-msg').value.trim().slice(0, 500);
            if (!name || !msg) return alert("Please fill all fields!");
            const newC = { id: Date.now(), name, message: msg, date: new Date().toLocaleString() };
            try {
                await save({ comments: arrayUnion(newC) });
                $('comm-msg').value = "";
                $('comm-name').value = "";
            } catch (e) {
                alert("Gagal mengirim komentar. Coba lagi.");
            }
        };

        $('save-btn').onclick = async () => {
            if (!isAdmin()) return;
            await save({ about: $('about-desc').innerHTML });
            alert("System Synced Successfully!");
        };

        window.switchTab = (type) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            $(`${type}-content`).classList.remove('hidden');
            $(`btn-${type}`).classList.add('active');
        };

        // --- ANIMATIONS ---
        let loadProgress = 0;
        const interval = setInterval(() => {
            loadProgress += 5;
            $('loading-bar').style.width = loadProgress + "%";
            if (loadProgress >= 100) { clearInterval(interval); document.body.classList.add('page-loaded'); document.body.classList.remove('overflow-hidden'); }
        }, 80);

        const canvas = $('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; particles = []; for (let i = 0; i < 40; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, size: Math.random() * 2 }); }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "rgba(59, 130, 246, 0.4)"; particles.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > canvas.width) p.vx *= -1; if (p.y < 0 || p.y > canvas.height) p.vy *= -1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }); requestAnimationFrame(animate); }
        initCanvas(); animate(); window.addEventListener('resize', initCanvas);
        if (window.AOS) AOS.init({ duration: 1000, once: true });
        </script>
</body>
</html>
